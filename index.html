<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { color-scheme: dark; }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>أكواد منصة QUREO</title>
<style>
:root {
  --bg: #0E1730;
  --surface: #16213F;
  --card: rgba(22, 33, 63, 0.96);
  --card-hero: rgba(22, 33, 63, 0.15);
  --card-res: rgba(22, 33, 63, 0.78);
  --bg-op: 0.42;
  --ink: #E6ECFA;
  --muted: #9DAAC8;
  --line: #2A3A62;
  --btn: #5CC3F0;
  --on-btn: #0E1730;
  --sky: #5CC3F0;
  --hex: #1F2D57;
  --glyph: #5CC3F0;
  --rain: #5CC3F0;
  --rain-a: 0.32;
  --ok-bg: #17382F;
  --warn-bg: #3B2A52;
  --amber: #FBB22E;
  --on-amber: #3A2A00;
  --teal: #17987F;
  --violet: #8E57BF;
  --mint: #4DE890;
  --pink: #E9A5F2;
  --win: #0B1A30;
  --win-bar: #071022;
  --win-line: #24406B;
  --win-dot: #5F7D9F;
  --win-title: #B7CBE2;
  --win-dim: #8FA8C6;
  --win-code: #86E6F7;
  --win-pass: #DDB9F7;
  --win-text: #DCE8F5;
  --win-btn: #5CC3F0;
  --win-on-btn: #0E2238;
  --font-display: "Reem Kufi", "Tajawal", Tahoma, system-ui, sans-serif;
  --font-body: "Tajawal", Tahoma, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}

/* وضع الـ Easter Egg السري */
:root.matrix-mode {
  --rain: #00FF66;
  --rain-a: 0.75;
  --sky: #00FF66;
  --glyph: #00FF66;
  --btn: #00FF66;
  --on-btn: #051A0D;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100%;
}
.app { position: relative; z-index: 1; max-width: 400px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }

.bar { display: flex; justify-content: flex-start; align-items: center; gap: 12px; min-height: 28px; }
.easter-badge {
  font-size: 1.15rem;
  line-height: 1;
  background: rgba(11, 26, 48, 0.85);
  border: 1px solid rgba(0, 255, 102, 0.55);
  padding: 6px 10px;
  border-radius: 999px;
  animation: pop .35s ease-out;
}

.card {
  background: var(--card);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.card-hero {
  background: var(--card-hero);
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform .12s ease;
}
.card-hero:active { transform: scale(0.985); }
.card-results { background: var(--card-res); padding: 16px 18px 20px; }
.hero { display: block; width: 100%; height: auto; max-height: 130px; direction: ltr; }
.hero .hex { fill: var(--hex); transition: fill .3s; }
.hero .glyph { fill: var(--glyph); font-family: var(--font-mono); font-weight: 700; font-size: 38px; transition: fill .3s; }
.hero .dash { fill: none; stroke: var(--sky); stroke-width: 2.5; stroke-dasharray: 6 6; stroke-linecap: round; stroke-linejoin: round; transition: stroke .3s; }
.hero .node { fill: var(--surface); stroke: var(--sky); stroke-width: 2.5; }
.hero .chip-t { font-family: var(--font-mono); font-weight: 700; font-size: 16px; }

.inner { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.head { display: flex; flex-direction: column; gap: 6px; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.22rem, 5vw, 1.45rem);
  line-height: 1.45;
  text-wrap: balance;
}
.sub-en {
  margin: 0;
  direction: ltr;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--btn);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 8px;
  letter-spacing: 0.01em;
  overflow-wrap: anywhere;
  transition: color .2s;
}
.hint { margin: 2px 0 0; font-size: .85rem; color: var(--muted); }

/* تنسيقات وضع الأكاديمية السري (Easter Egg) */
.easter-panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
  animation: pop .35s ease-out;
}
.easter-box {
  border-radius: 10px;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* بطاقة الأكاديمية: ألوان متغيرة باستمرار بين الأحمر والأزرق والأخضر */
.easter-rgb {
  border: 1.5px solid #FF4D6D;
  animation: academyRgbBox 6s ease-in-out infinite;
}
.easter-rgb .easter-txt {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.18rem;
  font-weight: 700;
  animation: academyRgbText 6s ease-in-out infinite;
}

@keyframes academyRgbBox {
  0% {
    background: rgba(255, 59, 92, 0.16);
    border-color: #FF4D6D;
    box-shadow: 0 0 14px rgba(255, 77, 109, 0.22);
  }
  33% {
    background: rgba(58, 174, 230, 0.17);
    border-color: #3AAEE6;
    box-shadow: 0 0 14px rgba(58, 174, 230, 0.22);
  }
  66% {
    background: rgba(0, 255, 102, 0.15);
    border-color: #00FF66;
    box-shadow: 0 0 14px rgba(0, 255, 102, 0.22);
  }
  100% {
    background: rgba(255, 59, 92, 0.16);
    border-color: #FF4D6D;
    box-shadow: 0 0 14px rgba(255, 77, 109, 0.22);
  }
}

@keyframes academyRgbText {
  0% {
    color: #FF5C77;
    text-shadow: 0 0 10px rgba(255, 92, 119, 0.3);
  }
  33% {
    color: #5CC3F0;
    text-shadow: 0 0 10px rgba(92, 195, 240, 0.3);
  }
  66% {
    color: #29FF7A;
    text-shadow: 0 0 10px rgba(41, 255, 122, 0.3);
  }
  100% {
    color: #FF5C77;
    text-shadow: 0 0 10px rgba(255, 92, 119, 0.3);
  }
}

/* بطاقة المدرسة: حركة حديثة تتبدل بين اللون الأحمر واللون الأخضر */
.easter-school {
  border: 1.5px solid #FF4D6D;
  animation: schoolBoxPulse 4.5s ease-in-out infinite alternate;
}
.easter-school .easter-txt {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 700;
  animation: schoolTextShift 4.5s ease-in-out infinite alternate;
}

@keyframes schoolBoxPulse {
  0% {
    background: rgba(255, 59, 92, 0.16);
    border-color: #FF4D6D;
    box-shadow: 0 0 14px rgba(255, 59, 92, 0.18);
  }
  100% {
    background: rgba(0, 255, 102, 0.15);
    border-color: #00FF66;
    box-shadow: 0 0 14px rgba(0, 255, 102, 0.18);
  }
}

@keyframes schoolTextShift {
  0% {
    color: #FF5C77;
    text-shadow: 0 0 10px rgba(255, 77, 109, 0.25);
  }
  100% {
    color: #29FF7A;
    text-shadow: 0 0 10px rgba(0, 255, 102, 0.25);
  }
}

/* عنوان التطوير في أعلى الإيستر إيج الأول: التبديل في الأماكن والألوان */
.dv-card {
  order: -1;
  border-radius: 10px;
  padding: 11px 13px;
  background: rgba(11, 26, 48, 0.88);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.dv-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.dv-title {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 0.88rem;
  font-weight: 700;
  color: #5CC3F0;
}
.dv-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  direction: ltr;
}
.dv-chip {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid currentColor;
  background: rgba(255, 255, 255, 0.04);
  transition: transform .35s ease, color .35s ease, border-color .35s ease, background-color .35s ease;
  animation: pop .3s ease-out;
}
.dv-c0 { color: #FF5C77; background: rgba(255, 92, 119, 0.13); }
.dv-c1 { color: #5CC3F0; background: rgba(92, 195, 240, 0.13); }
.dv-c2 { color: #29FF7A; background: rgba(41, 255, 122, 0.13); }

/* الإيستر إيج الثاني (الطبقة الداخلية السرية): العبارة الكاملة */
.nested-easter {
  border-radius: 10px;
  padding: 12px 14px;
  background: rgba(11, 26, 48, 0.92);
  border: 1.5px dashed #5CC3F0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  animation: pop .3s ease-out;
}
.nested-txt {
  margin: 0;
  font-family: var(--font-display);
  font-size: 0.94rem;
  font-weight: 700;
  line-height: 1.55;
  color: var(--ink);
}

.easter-btn {
  font: inherit;
  font-size: 0.85rem;
  font-weight: 700;
  padding: 7px 12px;
  border-radius: 8px;
  cursor: not-allowed;
  opacity: 0.72;
}
.easter-btn-rgb,
.easter-btn-school {
  background: rgba(255, 255, 255, 0.06);
  color: #E6ECFA;
  border: 1px solid rgba(255, 255, 255, 0.22);
}

.grade-switch {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 4px;
}
.grade-btn {
  font: inherit;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 7px 10px;
  border-radius: 7px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background-color .2s, color .2s, border-color .2s;
}
.grade-btn:hover:not(.active) { color: var(--ink); }
.grade-btn.active {
  background: var(--btn);
  color: var(--on-btn);
  border-color: var(--btn);
  font-weight: 700;
}
.grade-btn:focus-visible { outline: 2px solid var(--btn); outline-offset: 2px; }

.field {
  width: 100%;
  font: inherit; font-size: 1.05rem;
  color: var(--ink);
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  transition: border-color .2s, opacity .2s;
}
.field::placeholder { color: var(--muted); opacity: .8; }
.field:focus { outline: none; border-color: var(--btn); }
.field:focus-visible { outline: 2px solid var(--btn); outline-offset: 2px; }

.status { min-height: 2.1rem; margin: 0; display: flex; align-items: center; }
.status span { font-size: .92rem; padding: 3px 12px; border-radius: 999px; color: var(--ink); }
.status .ok { background: var(--ok-bg); }
.status .warn { background: var(--warn-bg); }

.entries { display: flex; flex-direction: column; gap: 18px; }
.entry { display: flex; flex-direction: column; gap: 8px; }
.entry + .entry { padding-top: 18px; border-top: 1.5px dashed var(--line); }
.entry-name {
  margin: 0;
  font-family: var(--font-display); font-weight: 600;
  font-size: 1.2rem; line-height: 1.3;
}
.entry-name.empty { color: var(--muted); }

.win {
  border-radius: 10px;
  overflow: hidden;
  background: var(--win);
  border: 1px solid var(--win-line);
}
.win-bar {
  display: flex; align-items: center; gap: 10px;
  background: var(--win-bar);
  padding: 8px 14px;
}
.dots { display: flex; gap: 6px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--win-dot); display: block; }
.win-title { font-size: .85rem; font-weight: 700; color: var(--win-title); letter-spacing: .02em; }
.win-body { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 14px; }
.val {
  flex: 1 1 140px; min-width: 0;
  font-family: var(--font-mono); font-weight: 600;
  font-size: 1.25rem; letter-spacing: .06em;
  text-align: left; direction: ltr;
  overflow-wrap: anywhere;
}
.win-code .val { color: var(--win-code); }
.win-pass .val { color: var(--win-pass); }
.val.empty { color: var(--win-dim); font-weight: 500; }
.btns { display: flex; gap: 6px; }
.btn {
  font: inherit; font-size: .85rem; font-weight: 500;
  padding: 6px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--win-line); background: transparent; color: var(--win-text);
  transition: border-color .2s;
}
.btn:hover:not(:disabled) { border-color: var(--win-code); }
.btn.primary { background: var(--win-btn); color: var(--win-on-btn); border-color: var(--win-btn); font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--win-code); outline-offset: 2px; }

.rain { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; }

.pop { animation: pop .35s ease-out; }
@keyframes pop { from { opacity: .35; transform: translateY(5px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .pop, .easter-rgb, .easter-rgb .easter-txt, .easter-school, .easter-school .easter-txt, .nested-easter, .dv-chip { animation: none; }
  * { transition: none !important; }
}
</style>
</head>
<body>
<canvas id="rain" class="rain" aria-hidden="true"></canvas>

<div class="app" dir="rtl" lang="ar">
  <div class="bar">
    <span id="easterBadge" class="easter-badge" hidden aria-label="وضع الجويستيك">🎮</span>
  </div>

  <!-- المربع العلوي: اضغط عليه 5 مرات متتالية لتفعيل أو إلغاء الـ Easter Egg -->
  <section id="heroCard" class="card card-hero" aria-hidden="true">
    <svg class="hero" viewBox="0 0 420 170" aria-hidden="true" focusable="false">
      <polygon class="hex" points="210,8 277,46 277,124 210,162 143,124 143,46"/>
      <text class="glyph" x="210" y="99" text-anchor="middle">&lt;/&gt;</text>

      <path class="dash" d="M22 62 H62 V43 H92"/>
      <circle class="node" cx="22" cy="62" r="5"/>
      <path class="dash" d="M346 38 H384 V92 H402"/>
      <circle class="node" cx="402" cy="92" r="5"/>
      <path class="dash" d="M346 128 H378 V150 H326"/>
      <circle class="node" cx="326" cy="150" r="5"/>

      <rect x="92" y="28" width="54" height="30" rx="8" fill="var(--amber)"/>
      <text class="chip-t" x="119" y="49" text-anchor="middle" fill="var(--on-amber)">JS</text>
      <rect x="284" y="58" width="62" height="30" rx="8" fill="var(--teal)"/>
      <text class="chip-t" x="315" y="79" text-anchor="middle" fill="#E9EDF8">CSS</text>
      <rect x="276" y="106" width="70" height="30" rx="8" fill="var(--violet)"/>
      <text class="chip-t" x="311" y="127" text-anchor="middle" fill="#E9EDF8">HTML</text>

      <rect x="150" y="14" width="22" height="10" fill="var(--mint)"/>
      <rect x="24" y="100" width="26" height="14" fill="var(--pink)"/>
      <rect x="64" y="138" width="22" height="9" rx="1" fill="var(--amber)" opacity=".6"/>
      <rect x="378" y="108" width="12" height="26" fill="var(--sky)"/>
    </svg>
  </section>

  <!-- المربع السفلي -->
  <main class="card card-top">
    <div class="inner">
      <!-- العناصر العادية للمنصة (تختفي عند تفعيل الـ Easter Egg) -->
      <div id="normalHeader" class="head">
        <h1>اكواد منصه QUREO لطلاب مدرسه الثانويه المشتركة</h1>
        <p id="subEn" class="sub-en" dir="ltr">{《&lt;ICT &amp; Programming &amp; Financial Literacy&lt;\&gt;》}</p>
        <p class="hint">اكتب اسمك</p>
      </div>

      <div id="gradeSwitch" class="grade-switch" role="group" aria-label="اختيار الصف الدراسي">
        <button type="button" class="grade-btn" data-grade="1" aria-pressed="false">الصف الأول</button>
        <button type="button" class="grade-btn active" data-grade="2" aria-pressed="true">الصف الثاني</button>
      </div>

      <!-- واجهة الـ Easter Egg الأول (تظهر فقط في الوضع السري) -->
      <div id="easterPanel" class="easter-panel" hidden>
        <!-- عنوان التطوير في أعلى الإيستر إيج الأول: التبديل في الأماكن والألوان -->
        <div class="dv-card">
          <div class="dv-head">
            <h2 id="dvTitle" class="dv-title">DEV تطوير</h2>
          </div>
          <div id="dvChips" class="dv-list"></div>
        </div>

        <div class="easter-box easter-rgb">
          <p id="academyTitle" class="easter-txt">طلاب اكادمية المبرمج الصغير</p>
          <button id="academyBtn" type="button" class="easter-btn easter-btn-rgb" disabled>دخول الأكاديمية</button>
        </div>

        <div class="easter-box easter-school">
          <p id="schoolTitle" class="easter-txt">من مدرسه البصيليه الثانويه المشتركة</p>
          <button id="schoolBtn" type="button" class="easter-btn easter-btn-school" disabled>بوابة المدرسة</button>
        </div>

        <!-- الإيستر إيج الثاني (الطبقة الداخلية السرية) -->
        <div id="nestedEasterBox" class="nested-easter" hidden>
          <p id="nestedEasterText" class="nested-txt">تطوير طلاب اكادميه المبرمج الصغير { يوسف JOKER} &amp;{Messi⁷⁰} &amp; {ashref aldoksy¹⁰}</p>
        </div>
      </div>

      <input id="q" class="field" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="اسمك" aria-label="اكتب اسمك">
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>
  </main>

  <section id="resultsCard" class="card card-results" aria-label="النتائج" hidden>
    <div id="entries" class="entries"></div>
  </section>
</div>

<!-- تحميل ملفات الصف الأول والثاني + ملف معلومات الإيستر إيج المستقل مع كسر الكاش -->

</script>

    devs: Array.isArray(primarySource.devs) && primarySource.devs.length
      ? primarySource.devs.slice()
      : ["JOKER", "Messi⁷", "AShraf"],
    nestedText: secondarySource.nestedText || "تطوير طلاب اكادميه المبرمج الصغير { يوسف JOKER} &{Messi⁷⁰} & {ashref aldoksy¹⁰}",
    extraInfo: null
  };

  function readEasterMeta() {
    try {
      var raw = localStorage.getItem(EASTER_META_KEY);
      if (!raw) return Object.assign({}, DEFAULT_EASTER_META, { devs: DEFAULT_EASTER_META.devs.slice() });
      var parsed = JSON.parse(raw);
      var merged = Object.assign({}, DEFAULT_EASTER_META, parsed || {});
      if (!Array.isArray(merged.devs) || !merged.devs.length) {
        merged.devs = DEFAULT_EASTER_META.devs.slice();
      }
      return merged;
    } catch (e) {
      return Object.assign({}, DEFAULT_EASTER_META, { devs: DEFAULT_EASTER_META.devs.slice() });
    }
  }

  function writeEasterMeta(partialMeta) {
    try {
      var next = Object.assign({}, readEasterMeta(), partialMeta || {});
      localStorage.setItem(EASTER_META_KEY, JSON.stringify(next));
      renderEasterMeta(next);
      return next;
    } catch (e) {
      return readEasterMeta();
    }
  }

  var currentMeta = readEasterMeta();
  var dvTick = 0;

  function renderDvRotation() {
    var container = $("dvChips");
    if (!container) return;
    var devs = currentMeta.devs && currentMeta.devs.length ? currentMeta.devs : DEFAULT_EASTER_META.devs;
    var len = devs.length;
    var shift = dvTick % len;
    var colorClasses = ["dv-c0", "dv-c1", "dv-c2"];

    container.textContent = "";
    for (var i = 0; i < len; i++) {
      var devName = devs[(i + shift) % len];
      var colorClass = colorClasses[(i + dvTick) % colorClasses.length];
      var chip = document.createElement("span");
      chip.className = "dv-chip " + colorClass;
      chip.textContent = devName;
      container.appendChild(chip);
    }
  }

  function renderEasterMeta(meta) {
    currentMeta = meta || readEasterMeta();
    $("academyTitle").textContent = currentMeta.academyText || DEFAULT_EASTER_META.academyText;
    $("academyBtn").textContent = currentMeta.academyBtnText || DEFAULT_EASTER_META.academyBtnText;
    $("schoolTitle").textContent = currentMeta.schoolText || DEFAULT_EASTER_META.schoolText;
    $("schoolBtn").textContent = currentMeta.schoolBtnText || DEFAULT_EASTER_META.schoolBtnText;
    $("dvTitle").textContent = currentMeta.dvLabel || DEFAULT_EASTER_META.dvLabel;
    $("nestedEasterText").textContent = currentMeta.nestedText || DEFAULT_EASTER_META.nestedText;
    $("academyBtn").disabled = true;
    $("schoolBtn").disabled = true;
    renderDvRotation();
  }

  window.QureoEasterStorage = {
    getMeta: readEasterMeta,
    setMeta: writeEasterMeta,
    clearMeta: function () {
      try { localStorage.removeItem(EASTER_META_KEY); } catch (e) {}
      renderEasterMeta(Object.assign({}, DEFAULT_EASTER_META, { devs: DEFAULT_EASTER_META.devs.slice() }));
    }
  };

  renderEasterMeta(currentMeta);

  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  if (!reduceMotion) {
    setInterval(function () {
      dvTick++;
      renderDvRotation();
    }, 1800);
  }

  /* ---------- Easter Egg الأساسي + الإيستر إيج الداخلي السري (J / ج) ---------- */
  var matrixActive = false;
  var subEasterActive = false;
  window.__rainBoost = 1;

  function saveEasterState(active) {
    try {
      if (active) {
        localStorage.setItem(EASTER_STATE_KEY, "1");
      } else {
        localStorage.removeItem(EASTER_STATE_KEY);
      }
    } catch (e) {}
  }

  function loadEasterState() {
    try {
      return localStorage.getItem(EASTER_STATE_KEY) === "1";
    } catch (e) {
      return false;
    }
  }

  function saveSubEasterState(active) {
    try {
      if (active) {
        localStorage.setItem(NESTED_J_KEY, "1");
      } else {
        localStorage.removeItem(NESTED_J_KEY);
      }
    } catch (e) {}
  }

  function loadSubEasterState() {
    try {
      return localStorage.getItem(NESTED_J_KEY) === "1";
    } catch (e) {
      return false;
    }
  }

  function applySubEaster(active, shouldSave) {
    subEasterActive = !!(matrixActive && active);
    if (shouldSave) saveSubEasterState(subEasterActive);
    $("nestedEasterBox").hidden = !subEasterActive;
  }

  function toggleSubEaster() {
    if (!matrixActive) return;
    applySubEaster(!subEasterActive, true);
  }

  function isTriggerJChar(ch) {
    var lower = String(ch || "").toLowerCase();
    return lower === "j" || lower === "ج";
  }

  function applyEasterEgg(active, shouldSave) {
    matrixActive = !!active;
    if (shouldSave) saveEasterState(matrixActive);

    root.classList.toggle("matrix-mode", matrixActive);
    $("easterBadge").hidden = !matrixActive;
    window.__rainBoost = matrixActive ? 2.4 : 1;

    $("normalHeader").hidden = matrixActive;
    $("gradeSwitch").hidden = matrixActive;
    $("easterPanel").hidden = !matrixActive;

    var qInput = $("q");
    qInput.disabled = false;

    if (matrixActive) {
      renderEasterMeta();
      applySubEaster(loadSubEasterState(), false);
      qInput.value = "";
      qInput.placeholder = "...";
      renderEntries([]);
      setStatus("", "");
    } else {
      applySubEaster(false, false);
      qInput.placeholder = "اسمك";
      search();
    }
  }

  function toggleEasterEgg() {
    applyEasterEgg(!matrixActive, true);
  }

  var tapCount = 0;
  var tapTimer = null;
  $("heroCard").addEventListener("click", function () {
    tapCount++;
    clearTimeout(tapTimer);
    if (tapCount >= 5) {
      tapCount = 0;
      toggleEasterEgg();
    } else {
      tapTimer = setTimeout(function () { tapCount = 0; }, 1200);
    }
  });

  var konami = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"];
  var kPos = 0;
  window.addEventListener("keydown", function (e) {
    var key = e.key.length === 1 ? e.key.toLowerCase() : e.key;

    if (matrixActive && isTriggerJChar(key)) {
      if (document.activeElement === $("q")) {
        e.preventDefault();
        $("q").value = "";
      }
      toggleSubEaster();
      return;
    }

    if (key === konami[kPos]) {
      kPos++;
      if (kPos === konami.length) {
        kPos = 0;
        toggleEasterEgg();
      }
    } else {
      kPos = 0;
    }
  });

  /* ---------- إدارة التبديل بين الصف الأول والثاني ---------- */
  var SUBTITLES = {
    "1": "{《<ICT & Programming<\\>》}",
    "2": "{《<ICT & Programming & Financial Literacy<\\>》}"
  };
  var FILE_NAMES = {
    "1": "المصدر للاكواد - الصف الاول.js",
    "2": "المصدر للاكواد - الصف الثاني.js"
  };
  var currentGrade = "2";

  function setGrade(grade) {
    currentGrade = grade;
    $("subEn").textContent = SUBTITLES[grade] || SUBTITLES["2"];

    var buttons = $("gradeSwitch").querySelectorAll(".grade-btn");
    Array.prototype.forEach.call(buttons, function (btn) {
      var isSelected = btn.getAttribute("data-grade") === grade;
      btn.classList.toggle("active", isSelected);
      btn.setAttribute("aria-pressed", isSelected ? "true" : "false");
    });

    search();
  }

  $("gradeSwitch").addEventListener("click", function (e) {
    var btn = e.target.closest(".grade-btn");
    if (!btn) return;
    var grade = btn.getAttribute("data-grade");
    if (grade && grade !== currentGrade) {
      setGrade(grade);
    }
  });

  /* ---------- أدوات مساعدة ---------- */
  function norm(s) {
    return String(s || "").trim().toLowerCase()
      .replace(/[ً-ٰٟـ]/g, "")
      .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه")
      .replace(/[٠-٩]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩".indexOf(d); })
      .replace(/\s+/g, " ");
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function mask(p) { return "•".repeat(Math.min(p.length, 12)); }
  function countWord(n) {
    if (n === 2) return "نتيجتين";
    if (n >= 3 && n <= 10) return n + " نتائج";
    return n + " نتيجة";
  }
  function selectNode(node) {
    try {
      var r = document.createRange(); r.selectNodeContents(node);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    } catch (e) {}
  }
  function flash(btn, text) {
    var old = btn.textContent;
    btn.textContent = text;
    setTimeout(function () { btn.textContent = old; }, 1400);
  }
  function copyText(text, btn, node, reveal) {
    var fail = function () {
      if (reveal) reveal();
      selectNode(node);
      flash(btn, "اتحدد، انسخه");
    };
    try {
      navigator.clipboard.writeText(text).then(function () { flash(btn, "تم النسخ"); }, fail);
    } catch (e) { fail(); }
  }

  /* ---------- بناء بطاقات النتائج ---------- */
  var box = $("entries");
  var lastKey = "";

  function windowEl(kind, title, value, secret) {
    var win = el("section", "win win-" + kind);
    win.setAttribute("aria-label", title);

    var bar = el("div", "win-bar");
    var dots = el("span", "dots");
    dots.setAttribute("aria-hidden", "true");
    for (var i = 0; i < 3; i++) dots.appendChild(el("i"));
    bar.appendChild(dots);
    bar.appendChild(el("span", "win-title", title));

    var body = el("div", "win-body");
    var shown = false;
    var val = el("div", value ? "val" : "val empty", value ? (secret ? mask(value) : value) : "—");
    var btns = el("div", "btns");
    var toggle = null;

    if (secret) {
      toggle = el("button", "btn", "إظهار");
      toggle.type = "button";
      toggle.disabled = !value;
      toggle.addEventListener("click", function () {
        shown = !shown;
        val.textContent = shown ? value : mask(value);
        toggle.textContent = shown ? "إخفاء" : "إظهار";
      });
      btns.appendChild(toggle);
    }

    var cp = el("button", "btn primary", "نسخ");
    cp.type = "button";
    cp.disabled = !value;
    cp.addEventListener("click", function () {
      copyText(value, cp, val, function () {
        if (secret && !shown) {
          shown = true;
          val.textContent = value;
          toggle.textContent = "إخفاء";
        }
      });
    });
    btns.appendChild(cp);

    body.appendChild(val);
    body.appendChild(btns);
    win.appendChild(bar);
    win.appendChild(body);
    return win;
  }

  function entryEl(u) {
    var a = el("article", "entry");
    a.appendChild(el("h2", u ? "entry-name" : "entry-name empty", u ? u.name : "—"));
    a.appendChild(windowEl("code", "الكود", u && u.code, false));
    a.appendChild(windowEl("pass", "كلمة السر", u && u.pass, true));
    return a;
  }

  function renderEntries(list) {
    var key = currentGrade + ":" + list.map(function (u) { return u.code; }).join("|");
    box.textContent = "";
    $("resultsCard").hidden = list.length === 0;
    list.forEach(function (u) { box.appendChild(entryEl(u)); });
    if (key && key !== lastKey) {
      Array.prototype.forEach.call(box.children, function (c) { c.classList.add("pop"); });
    }
    lastKey = key;
  }

  function setStatus(text, kind) {
    var s = $("status");
    s.textContent = "";
    if (text) {
      var span = el("span", kind, text);
      s.appendChild(span);
    }
  }

  /* ---------- البحث داخل الصف المختار (معزول تماماً في وضع الإيستر إيج) ---------- */
  function search() {
    if (matrixActive) {
      var qVal = $("q").value;
      if (qVal && (qVal.toLowerCase().indexOf("j") !== -1 || qVal.indexOf("ج") !== -1)) {
        $("q").value = "";
        toggleSubEaster();
      }
      renderEntries([]);
      setStatus("", "");
      return;
    }

    var n = norm($("q").value);
    var usersList = DATA[currentGrade] || [];
    var list = [];

    if (!n) {
      setStatus("", "");
    } else if (usersList.length === 0) {
      setStatus("تأكد من وجود بيانات في ملف: " + FILE_NAMES[currentGrade], "warn");
    } else {
      list = usersList.filter(function (u) { return norm(u.name) === n; });
      if (list.length !== 1 && n.length >= 2) {
        var toks = n.split(" ");
        list = usersList.filter(function (u) {
          var words = norm(u.name).split(" ");
          return toks.every(function (t) {
            return words.some(function (w) { return w.indexOf(t) === 0; });
          });
        });
      }
      if (list.length === 1) {
        setStatus("أهلاً يا " + list[0].name, "ok");
      } else if (list.length > 1) {
        setStatus("تم العثور على " + countWord(list.length), "ok");
      } else if (n.length >= 2) {
        setStatus("مفيش نتيجة في هذا الصف، اتأكد من الاسم أو الصف", "warn");
      }
    }
    renderEntries(list);
  }
  $("q").addEventListener("input", search);

  renderEntries([]);
  if (loadEasterState()) {
    applyEasterEgg(true, false);
  } else {
    search();
  }
})();

/* خلفية الأرقام المتساقطة */
(function () {
  var cv = document.getElementById("rain");
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext("2d");
  var SIZE = 15, COLW = 11, TRAIL = 14, MAX_ALPHA = 0.32;
  var FONT = '600 13px "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace';
  var cols = [], w = 0, h = 0, last = 0, timer = null;
  var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  function digit() { return String(Math.floor(Math.random() * 10)); }
  function color() {
    var v = getComputedStyle(document.documentElement).getPropertyValue("--rain").trim();
    var m = /^#?([0-9a-f]{6})$/i.exec(v);
    if (!m) return "58,174,230";
    var n = parseInt(m[1], 16);
    return ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255);
  }
  function alpha() {
    var a = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--rain-a"));
    return a > 0 ? a : MAX_ALPHA;
  }
  function makeCol() {
    var ch = [];
    for (var i = 0; i < TRAIL; i++) ch.push(digit());
    return { y: -Math.random() * (h / SIZE) * 0.45, speed: 0.5 + Math.random() * 0.55, row: 0, ch: ch };
  }
  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = [];
    var n = Math.ceil(w / COLW);
    for (var i = 0; i < n; i++) {
      var c = makeCol();
      if (reduce) c.y = Math.random() * (h / SIZE);
      cols.push(c);
    }
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    ctx.font = FONT;
    ctx.textBaseline = "top";
    var rgb = color(), amax = alpha();
    for (var i = 0; i < cols.length; i++) {
      var c = cols[i], head = Math.floor(c.y);
      for (var k = 0; k < TRAIL; k++) {
        var row = head - k;
        if (row < 0) continue;
        ctx.fillStyle = "rgba(" + rgb + "," + ((1 - k / TRAIL) * amax).toFixed(3) + ")";
        ctx.fillText(c.ch[k], i * COLW + 1, row * SIZE);
      }
    }
  }
  function step(t) {
    requestAnimationFrame(step);
    if (document.hidden || t - last < 42) return;
    last = t;
    var boost = window.__rainBoost || 1;
    for (var i = 0; i < cols.length; i++) {
      var c = cols[i], before = Math.floor(c.y);
      c.y += c.speed * boost;
      if (Math.floor(c.y) !== before) { c.ch.unshift(digit()); c.ch.pop(); }
      for (var k = 0; k < TRAIL; k++) {
        if (Math.random() < (k === 0 ? 0.6 : 0.12)) c.ch[k] = digit();
      }
      if (c.y - TRAIL > h / SIZE) cols[i] = makeCol();
    }
    draw();
  }

  resize();
  window.addEventListener("resize", function () {
    clearTimeout(timer);
    timer = setTimeout(resize, 200);
  });
  if (!reduce) requestAnimationFrame(step);
})();
</script>
</body>
